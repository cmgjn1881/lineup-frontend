<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>카카오 로그인 리다이렉트</title>
    <script>
      // 1. URL의 쿼리 파라미터에서 'code'를 추출합니다.
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');

      if (code) {
        // 2. 성공 시, 'kakao-code'라는 키로 localStorage에 저장합니다.
        localStorage.setItem('kakao-code', code);
        // 3. HashRouter가 인식할 수 있는 콜백 경로로 이동시킵니다.
        window.location.href = '/#/kakao/callback';
      } else if (error) {
        // 실패 시 에러 정보를 저장하고 이동할 수도 있습니다.
        localStorage.setItem(
          'kakao-error',
          JSON.stringify({ error: error, error_description: params.get('error_description') })
        );
        window.location.href = '/#/kakao/callback';
      }
    </script>
  </head>
  <body>
    카카오 로그인 처리 중...
  </body>
</html>
