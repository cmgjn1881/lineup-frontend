<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>카카오 로그인 리다이렉트</title>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        // 기존의 카카오 로그인 콜백 처리
        const code = params.get('code');
        const error = params.get('error');

        if (code) {
          // 성공 시, 'kakao-code'라는 키로 localStorage에 저장
          localStorage.setItem('kakao-code', code);
          // HashRouter가 인식할 수 있는 콜백 경로로 이동
          window.location.href = '/#/kakao/callback';
        } else if (error) {
          // 실패 시 에러 정보를 저장하고 이동
          localStorage.setItem(
            'kakao-error',
            JSON.stringify({ error, error_description: params.get('error_description') })
          );
          window.location.href = '/#/kakao/callback';
        }
      });
    </script>
  </head>
  <body>
    카카오 로그인 처리 중...
  </body>
</html>
